<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Cascade Example</title>
    <style>
      p {
        color: blue;
      }
      p {
        color: red;
      }
      .text {
        color: green !important;
      }
      #text-id {
        color: yellow;
      }
    </style>
  </head>
  <body>
    <p class="text" id="text-id" style="color: turquoise">
      This text will be red.
    </p>
  </body>
</html>
